spring.application.name=professional-challenge-api

spring.h2.console.enabled=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:products
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads

# JWT (in production set the JWT_SECRET environment variable; must be at least 32 characters)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-with-a-long-random-string-32+}
jwt.expiration-ms=86400000

# Parent admin account created on startup (in production set ADMIN_EMAIL and ADMIN_PASSWORD).
app.admin.email=${ADMIN_EMAIL:admin@nexo.com}
app.admin.password=${ADMIN_PASSWORD:Admin123456}
app.admin.name=Administrador
app.admin.last-name=Nexo

# Email: Mailtrap sandbox in development (Email Testing -> Inboxes -> SMTP).
# Credentials only through environment variables, never in this file.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:no-reply@nexo.com}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.mail.resend-cooldown-seconds=60
